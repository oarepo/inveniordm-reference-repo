[project]
name = "inveniordm-reference-repo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">= 3.14"

[project.entry-points."invenio_base.blueprints"]
inveniordm_reference_repo_views = "inveniordm_reference_repo.views:create_blueprint"

[project.entry-points."invenio_assets.webpack"]
inveniordm_reference_repo_theme = "inveniordm_reference_repo.webpack:theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inveniordm_reference_repo"]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = ["D401", "D403"]

[tool.pytest.ini_options]
addopts = ["--isort", "--pydocstyle", "--doctest-glob=\"*.rst\"", "--doctest-modules", "--cov=inveniordm_reference_repo", "--cov-report=term-missing", "--exclude-warning-annotations"]
testpaths = "tests inveniordm_reference_repo"
live_server_scope = "module"
